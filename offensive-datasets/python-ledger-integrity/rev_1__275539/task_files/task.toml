schema_version = "1.0"

[metadata]
author_organization = "Matrix Security Solutions"
category = "cybersecurity"
benchmark_type = "cyber-bench"
tags = ["offensive", "web", "http", "accounting", "python", "django"]
expert_time_estimate_hours = 5.0

[verifier]
timeout_sec = 1200.0
environment_mode = "shared"

[agent]
timeout_sec = 10800.0
user = "auditor"

[environment]
network_mode = "no-network"
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"
