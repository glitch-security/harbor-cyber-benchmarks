schema_version = "1.0"

[metadata]
author_organization = "Matrix Security Solutions"
category = "cybersecurity"
benchmark_type = "cyber-bench"
tags = [
  "offensive",
  "black-box",
  "web",
  "python",
  "data-confidentiality",
]
expert_time_estimate_hours = 12.0

[verifier]
timeout_sec = 1200.0

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[agent]
timeout_sec = 10800.0
user = "auditor"

[environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 8192
storage_mb = 15360
