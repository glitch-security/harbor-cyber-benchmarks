# Appliance Apache 2.4.68 (mod_proxy_uwsgi). Minimal build: proxy + proxy_uwsgi
# are static (built-in, not LoadModule'd); base modules are DSO. Internal
# loopback listener; the public gateway is the relay in front of it.
ServerRoot "/opt/httpd"
Listen 127.0.0.1:8080
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule watchdog_module modules/mod_watchdog.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
User ckan
Group ckan-sys
ServerName localhost
ServerTokens Prod
ServerSignature Off
PidFile /var/lib/appliance/httpd.pid
ErrorLog /var/lib/appliance/logs/httpd-error.log
LogLevel warn
ProxyPass / uwsgi://127.0.0.1:5210/
ProxyPassReverse / uwsgi://127.0.0.1:5210/
<Proxy *>
    Require all granted
</Proxy>
